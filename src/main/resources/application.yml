spring:
  application:
    name: options-quant

  main:
    web-application-type: servlet

server:
  port: 9090
  tomcat:
    accesslog:
      enabled: true
      pattern: '%h %l %u %t "%r" %s %b %D'


# Micrometer / Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

# Logging
logging:
  level:
    com.fgiaquinta.optionsquant: DEBUG
    com.fgiaquinta.optionsquant.infrastructure: DEBUG
    com.ib: INFO
    org.springframework.web: INFO

