spring:
  application:
    name: options-quant

  main:
    web-application-type: servlet

server:
  port: 9090
  tomcat:
    accesslog:
      enabled: true
      pattern: '%h %l %u %t "%r" %s %b %D'


# Micrometer / Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

# Logging
logging:
  level:
    com.fgiaquinta.optionsquant: DEBUG
    com.fgiaquinta.optionsquant.infrastructure: DEBUG
    com.ib: INFO
    org.springframework.web: INFO

# IBKR TWS Configuration
ibkr:
  host: 127.0.0.1
  port: 7497 #live is 7496
  sync-timeout: 30
  auto-execute: true
  account-id: "DUN598126"
  default-qty: 10
  risk-per-trade-pct: 0.02
  use-csv-tickers: true  # Use tickers.csv instead of YAML list
  tickers: []  # Legacy list - kept for backwards compatibility. See data/tickers.csv
  hot-ticker-count: 20  # Number of top CSV tickers to scan first (by market cap)

  # Hot Tickers: Scanned FIRST on every cycle (high-priority, high-volume)
  # These are analyzed before the remaining 500+ tickers for faster signal detection
  hot-tickers:
    - SPY     # S&P 500 ETF (market benchmark)
    - QQQ     # Nasdaq 100 ETF (tech-heavy)
    - AAPL    # Apple
    - MSFT    # Microsoft
    - NVDA    # NVIDIA (AI boom)
    - TSLA    # Tesla
    - AMZN    # Amazon
    - META    # Meta/Facebook
    - GOOGL   # Google/Alphabet
    - AMD     # AMD (semiconductors)
    - JPM     # JPMorgan (financials)
    - V       # Visa (payments)
    - BRK.B   # Berkshire Hathaway
    - XOM     # Exxon (energy)
    - JNJ     # Johnson & Johnson (healthcare)

# Telegram Bot Configuration
telegram:
  enabled: true
  bot-token: "REDACTED_TELEGRAM_BOT_TOKEN"  # Replace with your bot token from @BotFather
  chat-id: "REDACTED_CHAT_ID"      # Replace with your chat ID
  webhook-secret: "REDACTED_WEBHOOK_SECRET"  # Secret to validate webhook requests (min 32 chars)
  master-key: "REDACTED_MASTER_KEY"  # Master key for secure order signatures (min 32 chars)

# Local AI Configuration (Ollama)
ollama:
  enabled: true
  url: http://localhost:11434
  model: qwen2.5:7b

# Backtest CLI Configuration
backtest-cli:
  enabled: false  # Enable interactive backtest analysis menu (disabled by default - use for manual analysis only)
