spring:
  application:
    name: options-quant

  main:
    web-application-type: servlet

  devtools:
    restart:
      enabled: true
      quiet-period: 2s
      poll-interval: 3s
      additional-exclude: "data/**,logs/**,backtest/**"
    livereload:
      enabled: false  # Not needed - frontend uses Vite HMR

server:
  port: 9090
  tomcat:
    accesslog:
      enabled: true
      pattern: '%h %l %u %t "%r" %s %b %D'


# Micrometer / Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

# Logging
logging:
  level:
    com.fgiaquinta.optionsquant: DEBUG
    com.fgiaquinta.optionsquant.infrastructure: DEBUG
    com.ib: INFO
    org.springframework.web: INFO

# IBKR TWS Configuration
ibkr:
  host: 127.0.0.1
  port: 7497 #live is 7496
  # Each value MUST be unique in TWS → Configure → API → Settings (see "Trusted IPs" and client id collisions).
  data-client-id: 1      # IbkrService (historical / market data requests)
  orders-client-id: 3   # OrderExecutionService (orders + option chain) — was 2; change if another app uses 3
  account-client-id: 999 # AccountManager (balance / portfolio)
  sync-timeout: 30
  auto-execute: true
  account-id: "DUN598126"
  default-qty: 10
  risk-per-trade-pct: 0.02
  hot-ticker-count: 20  # Used when hot-tickers is empty: top N CSV names by market cap (see TickerService)

# Telegram Bot Configuration
telegram:
  enabled: true
  bot-token: "REDACTED_TELEGRAM_BOT_TOKEN"  # Replace with your bot token from @BotFather
  chat-id: "REDACTED_CHAT_ID"      # Replace with your chat ID
  webhook-secret: "REDACTED_WEBHOOK_SECRET"  # Secret to validate webhook requests (min 32 chars)
  master-key: "REDACTED_MASTER_KEY"  # Master key for secure order signatures (min 32 chars)

# Local AI Configuration (Ollama)
ollama:
  enabled: true
  url: http://localhost:11434
  model: qwen2.5:7b

# Live strategy scan: AUTO leaves CPU headroom for IDE/OS; HYBRID orders non-hot tickers by fundamentals + ticker memory
scanner:
  concurrent-mode: AUTO
  fixed-max-concurrent: 4
  auto-reserve-logical-cpus: 4
  auto-min-concurrent: 1
  auto-max-concurrent-cap: 6
  prioritization-mode: HYBRID
  hybrid-fundamental-weight: 0.65
  hybrid-memory-weight: 0.35
  # Exclusive IBKR scan lock: only one scanAll at a time (see StrategyScannerService)
  exclusive-scan-scheduler-lock-wait-ms: 5000   # Startup/cron tryLock; skip scan if busy after this
  live-preempt-wait-ms: 60000                 # Live manual scan: max wait for other scan to release lock after stopDownloads

backtest:
  default-max-concurrent-scans: 4
  generate-trade-charts: true
  # Delay after each scheduled backtest completes (ms). Only applies when auto-run is enabled in the UI.
  scheduler:
    fixed-delay-ms: 3600000

# Grid search (POST /backtest-ui/grid-search): max Cartesian product size for EXHAUSTIVE mode;
# RANDOM mode also requires randomSampleCount <= max-cells.
# timeout-ms: wall-clock cap for the whole request (single grid or full walk-forward). Partial rows + CSV still returned. 0 = no cap.
grid-search:
  max-cells: 500
  timeout-ms: 3600000

# Ticker learning / risk overrides JSON (atomic save on write)
ticker:
  memory:
    file: data/ticker-memory.json

# Backtest CLI Configuration
backtest-cli:
  enabled: false  # Enable interactive backtest analysis menu (disabled by default - use for manual analysis only)

# Live Replay Mode: historical candle replay through the live scanner pipeline.
# Purpose: tune E2E detection outside US market hours. Orders DO fire to TWS paper.
replay:
  enabled: true
  max-orders-per-minute: 10
  jitter-ms-min: 100
  jitter-ms-max: 800
  signals-file-pattern: "data/replay-signals-%s-%s.jsonl"  # %s %s = date, runId
