# Nightly: full JVM verification + merged JaCoCo (unit + e2e + slow).
# Local equivalent: ./gradlew installPlaywrightBrowsers coverageReport
name: Nightly coverage

on:
  schedule:
    # 06:00 UTC — adjust for your timezone
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium (Java)
        run: chmod +x gradlew && ./gradlew installPlaywrightBrowsers --no-daemon

      - name: coverageReport (test + e2eTest + slowTest + jacocoTestReport)
        run: ./gradlew coverageReport --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-html
          path: build/reports/jacoco/test/html/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-xml
          path: build/reports/jacoco/test/jacocoTestReport.xml
